name: 텔레그램 데일리 브리핑

# GitHub 예약 실행은 정시에 오지 않는다. 이 저장소 실측(09-08~09-11)은
# 1차 cron이 매번 3시간 30분가량 밀려, 20:37 예약이 다음 날 00:07에 실행됐다.
#
# 그래서 두 가지를 같이 건다.
#   1) 지연을 역산해 이른 시각에도 cron을 걸어둔다 (17:30 + 3.5h ≈ 21:00 KST)
#   2) 실제 실행 시각이 유효 구간(20:00~익일 09:00 KST)일 때만 보낸다
# GitHub가 정시에 돌든 3시간 밀리든, 처음으로 구간 안에 들어온 회차가 보낸다.
# 구간 밖이면 마커를 남기지 않으므로 다음 회차가 이어받는다.
#
# 20:00 하한은 넥스트레이드 애프터마켓 종료 시각이다. 그 전에 보내면
# 시간외 '최종' 체결가가 아닌 장중 값이 찍힌다 — 낮추지 말 것.
on:
  schedule:
    - cron: '30 8 * * 1-5'    # 17:30 KST — 지연 시 약 21:00 도착 (주 경로)
    - cron: '30 9 * * 1-5'    # 18:30 KST — 지연 시 약 22:00
    - cron: '5 11 * * 1-5'    # 20:05 KST — 지연이 없을 때의 주 경로
    - cron: '35 12 * * 1-5'   # 21:35 KST — 마지막 보루
  workflow_dispatch:

jobs:
  briefing:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      # 장 기준일 = 데이터가 속한 거래일. 자정 넘겨 실행되면 전날이고,
      # 주말로 밀렸으면 직전 금요일이다. 마커 키도 이 날짜로 잡아야
      # 00:07 실행이 다음 날로 오인돼 이중 발송되지 않는다.
      - name: 장 기준일 · 발송 구간 판정
        id: gate
        run: |
          H=$(TZ=Asia/Seoul date +%-H)
          NOW=$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')
          if [ "$H" -ge 9 ]; then
            D=$(TZ=Asia/Seoul date +%Y-%m-%d)
          else
            D=$(TZ=Asia/Seoul date -d 'yesterday' +%Y-%m-%d)
          fi
          while [ "$(date -d "$D" +%u)" -ge 6 ]; do
            D=$(date -d "$D -1 day" +%Y-%m-%d)
          done
          echo "  현재 KST $NOW · 장 기준일 $D"
          echo "date=$D" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "  수동 실행 — 구간 검사 생략"
            echo "in_window=true" >> "$GITHUB_OUTPUT"
          elif [ "$H" -ge 20 ] || [ "$H" -lt 9 ]; then
            echo "  발송 구간 안 (20:00~익일 09:00)"
            echo "in_window=true" >> "$GITHUB_OUTPUT"
          else
            echo "  아직 이름 — 시간외 종료(20:00) 전이라 건너뜀. 다음 회차가 처리"
            echo "in_window=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 오늘 발송 여부 확인
        id: guard
        if: steps.gate.outputs.in_window == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .briefing-marker
          key: briefing-sent-${{ steps.gate.outputs.date }}
          lookup-only: true

      - name: 발송 여부 판단
        id: decide
        run: |
          if [ "${{ steps.gate.outputs.in_window }}" != "true" ]; then
            echo "send=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.guard.outputs.cache-hit }}" = "true" ] \
               && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "  ${{ steps.gate.outputs.date }} 이미 발송됨 — 건너뜀"
            echo "send=false" >> "$GITHUB_OUTPUT"
          else
            echo "  ${{ steps.gate.outputs.date }} 발송 진행"
            echo "send=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Python 3.11 셋업
        if: steps.decide.outputs.send == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 브리핑은 MongoDB·기관 데이터가 필요 없어 필요한 것만 설치한다
      - name: 패키지 설치
        if: steps.decide.outputs.send == 'true'
        run: pip install pandas requests finance-datareader pykrx yfinance

      - name: 설정 파일 생성 (Secrets → .py)
        if: steps.decide.outputs.send == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KRX_ID_VAL: ${{ secrets.KRX_ID }}
          KRX_PW_VAL: ${{ secrets.KRX_PW }}
        run: |
          python - <<'PYEOF'
          import os
          with open('telegram_config.py', 'w') as f:
              f.write(f'BOT_TOKEN = {repr(os.environ.get("TELEGRAM_BOT_TOKEN",""))}\n')
              f.write(f'CHAT_ID   = {repr(os.environ.get("TELEGRAM_CHAT_ID",""))}\n')
          with open('krx_config.py', 'w') as f:
              f.write(f'KRX_ID = {repr(os.environ.get("KRX_ID_VAL",""))}\n')
              f.write(f'KRX_PW = {repr(os.environ.get("KRX_PW_VAL",""))}\n')
          PYEOF

      - name: 브리핑 전송
        if: steps.decide.outputs.send == 'true'
        run: python send_telegram.py

      # 전송이 실패하면 이 단계는 실행되지 않는다 → 마커가 안 남아 다음 회차가 재시도
      - name: 발송 마커 기록
        if: steps.decide.outputs.send == 'true' && success()
        run: |
          mkdir -p .briefing-marker
          date -u +%FT%TZ > .briefing-marker/sent

      - name: 발송 마커 저장
        if: steps.decide.outputs.send == 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: .briefing-marker
          key: briefing-sent-${{ steps.gate.outputs.date }}
